name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit + integration together (Docker is available on ubuntu runners for Testcontainers).
      # Coverage is measured across both: wiring, resolvers and the Prisma adapters are exercised
      # by the integration tests, so a unit-only gate under-reports (it read 83% vs 99.6% overall).
      - run: npm run test:cov
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
